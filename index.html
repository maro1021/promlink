<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7ff">
<title>프롬링크 · 프롬프트를 링크에 담아 공유</title>
<style>
:root { color-scheme:light; --page:#f6f8ff; --card:#fff; --head:#f9faff; --ink:#182543; --sub:#8793b4; --line:#e3e9f9; --primary:#5664e9; --tint:#eef1ff; --fill:#f9fbff; --danger:#dc647d; --shadow:0 12px 34px rgba(35,50,121,.055); }
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#151a2a;--card:#222b40;--head:#253047;--ink:#edf1ff;--sub:#a2acc5;--line:#38445e;--primary:#a4adff;--tint:#323c60;--fill:#1b2437;--danger:#f09caf;--shadow:0 12px 34px rgba(0,0,0,.14)}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--page);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Pretendard","Noto Sans KR","Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 28%,transparent);outline-offset:2px}button:disabled{opacity:.3;cursor:not-allowed}button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.shell{max-width:980px;margin:0 auto;padding:34px 20px 72px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;margin:0 0 17px}.heading{display:flex;align-items:center;gap:12px;min-width:0}.heading h1{font-size:22px;letter-spacing:-.7px;line-height:1.3;margin:0;font-weight:800}.badge{min-width:34px;height:34px;padding:0 11px;border-radius:100px;display:grid;place-items:center;background:var(--tint);font-size:13px;font-weight:800;color:var(--primary)}.helper{font-size:13px;color:var(--sub);white-space:nowrap}
.blocks{display:flex;flex-direction:column;gap:16px}.block{border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;transition:border-color .12s,box-shadow .12s}.block.drop-target{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 13%,transparent)}.block.dragging{opacity:.6}.blockhead{display:flex;align-items:center;gap:13px;padding:17px 22px;background:var(--head);border-bottom:1px solid var(--line);min-height:78px}.handle{width:34px;height:34px;flex:none;display:grid;place-items:center;color:var(--sub);background:none;border:0;border-radius:10px;touch-action:none;cursor:grab}.handle:active{cursor:grabbing}.handle svg{width:19px;height:19px}.index{height:36px;min-width:36px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--tint);color:var(--primary);font-size:14px;font-weight:850}.titleInput{font-size:17px;font-weight:800;color:var(--ink);min-width:30px;width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 4px;text-overflow:ellipsis}.titleInput:hover,.titleInput:focus{background:var(--card);border-color:var(--line);outline:0}.titleInput::placeholder{color:var(--sub)}.headbuttons{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none}.iconbtn{display:grid;place-items:center;width:36px;height:36px;border:none;background:none;border-radius:10px;color:#8692b1}.iconbtn:hover{background:var(--tint);color:var(--primary)}.iconbtn.delete:hover{background:#fff0f2;color:var(--danger)}
.blockbody{padding:20px}.prompt{display:block;width:100%;min-height:180px;resize:vertical;overflow:hidden;border:1px solid var(--line);background:var(--fill);color:var(--ink);border-radius:17px;line-height:1.85;font-size:14px;font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;padding:17px 18px;white-space:pre-wrap;word-break:break-word;tab-size:2}.prompt:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent)}.prompt::placeholder{color:#a3abc5}.under{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px}.note{font-size:12px;color:var(--sub)}.copybtn{border:none;border-radius:14px;color:var(--primary);background:var(--tint);min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 19px;font-weight:800;white-space:nowrap}.copybtn:hover{filter:brightness(.97)}
.addbtn{margin-top:18px;width:100%;height:62px;display:flex;justify-content:center;align-items:center;gap:9px;border:2px dashed #cdd4f3;border-radius:21px;background:transparent;color:var(--primary);font-size:16px;font-weight:800}.addbtn:hover{background:var(--tint);border-color:var(--primary)}.sharebtn{margin-top:18px;width:100%;border:0;min-height:66px;border-radius:19px;background:linear-gradient(105deg,#6977f3,#5963dc);box-shadow:0 12px 26px rgba(80,91,213,.2);color:white;font-size:18px;font-weight:800;letter-spacing:-.3px}.sharebtn:hover{filter:brightness(1.04)}.sharebtn svg{vertical-align:-4px;margin-right:7px}.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:.2s;background:#232d55;color:white;border-radius:100px;padding:11px 20px;font-size:13px;font-weight:700;box-shadow:0 12px 30px #171b3540;z-index:10;white-space:nowrap}.toast.show{transform:translate(-50%,0);opacity:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow)}.center{text-align:center}.successicon{display:grid;place-items:center;margin:0 auto 13px;width:58px;height:58px;border-radius:21px;background:var(--tint);font-size:27px;color:var(--primary)}.panel h1,.panel h2{margin:0 0 9px;letter-spacing:-.6px}.panel h1{font-size:24px}.panel p{margin:0;color:var(--sub)}.linkbox{display:flex;align-items:center;gap:12px;margin:24px 0 16px;padding:12px 14px;background:var(--fill);border:1px solid var(--line);border-radius:15px}.linkbox input{min-width:0;flex:1;background:none;border:0;outline:0;color:var(--ink);font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.actions > button{flex:1 1 170px;min-height:50px;padding:9px 15px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800}.actions > button.main{background:var(--primary);color:var(--card);border-color:var(--primary)}.demo-warning{margin-top:18px !important;font-size:12px;line-height:1.7}.previewbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:19px;flex-wrap:wrap}.previewbar h1{font-size:21px;margin:0;letter-spacing:-.5px}.previewbar .copybtn{min-height:41px;padding:0 13px}.viewcontent{padding:21px}.readtext{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:16px;background:var(--fill);padding:18px;font:14px/1.85 ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;min-height:88px}.viewhint{font-size:13px;color:var(--sub);margin:0 0 20px}.viewactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:21px}.viewactions .sharebtn{margin:0;flex:1;min-width:200px}.viewactions .addbtn{margin:0;flex:1;min-width:200px;height:66px}.empty{padding:25px 0;text-align:center;color:var(--sub)}.hidden{display:none !important}
@media(max-width:620px){.shell{padding:18px 12px 55px}.topline{margin-bottom:12px}.heading{gap:8px}.heading h1{font-size:19px}.badge{height:30px;min-width:30px;padding:0 9px}.helper{font-size:0;white-space:normal}.helper:after{content:'↕ 순서 변경';font-size:11px}.block{border-radius:20px}.blockhead{gap:6px;padding:11px 11px;min-height:68px}.handle{width:26px;height:33px}.index{min-width:29px;height:32px;font-size:12px;border-radius:10px}.titleInput{font-size:16px;padding:7px 2px;min-width:0}.headbuttons{gap:0}.iconbtn{width:31px;height:35px}.iconbtn svg{width:17px;height:17px}.blockbody{padding:13px}.prompt{font-size:13px;padding:14px;min-height:164px}.under{margin-top:10px}.copybtn{min-height:42px;padding:0 13px}.addbtn{height:56px;border-radius:16px}.sharebtn{min-height:60px;border-radius:16px}.panel{padding:22px 17px}.previewbar h1{font-size:19px}.viewcontent{padding:13px}.readtext{padding:14px;font-size:13px}.linkbox{flex-wrap:wrap}}

/* Link-embedded, database-free version */
.length-note{margin:17px 0 0 !important;text-align:center;font-size:12px !important;line-height:1.75 !important;color:var(--sub)}
.length-note.caution{color:#aa6533 !important}
.length-note.warning{color:var(--danger) !important;font-weight:700}
.smallnote{font-size:12px !important;line-height:1.8 !important;margin-top:13px !important;color:var(--sub)}
.linkbox input{user-select:all}
.sharebtn:disabled{opacity:.6}
.share-menu{display:none}
@media(hover:none) and (pointer:coarse){.share-menu{display:block}}
</style>
</head>
<body>
<main class="shell" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
// The link itself contains the complete prompt. There is no localStorage,
// remote request, database, account, upload, or list of generated shares.
const app=document.getElementById('app');const toastEl=document.getElementById('toast');
const icons={dots:'<svg viewBox="0 0 24 24"><circle cx="8" cy="5" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="5" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="19" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="19" r="1" fill="currentColor" stroke="none"/></svg>',up:'<svg viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></svg>',down:'<svg viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></svg>',trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/></svg>',copy:'<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',link:'<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.72"/></svg>'};
let sections=[{id:makeId(),title:'공통',content:'2boys, winter date, cozy atmosphere, warm lighting, detailed illustration,\n2::soft snowfall::'}];
let mode='edit',currentView=null,latestLink='',latestData=null,toastTimer=0;
function makeId(){const arr=new Uint8Array(12);if(globalThis.crypto&&crypto.getRandomValues)crypto.getRandomValues(arr);else for(let i=0;i<arr.length;i++)arr[i]=Math.floor(Math.random()*256);return Array.from(arr,n=>n.toString(16).padStart(2,'0')).join('')}
function el(tag,cl,txt){const n=document.createElement(tag);if(cl)n.className=cl;if(txt!=null)n.textContent=txt;return n}
function iconButton(icon,label,action,i,del=false){const b=el('button','iconbtn'+(del?' delete':''));b.type='button';b.title=label;b.setAttribute('aria-label',label);b.dataset.action=action;b.dataset.index=i;b.innerHTML=icons[icon];return b}
function notify(msg){clearTimeout(toastTimer);toastEl.textContent=msg;toastEl.classList.add('show');toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2300)}
function autoSize(t){t.style.height='auto';t.style.height=Math.max(180,t.scrollHeight)+'px'}
function copyFallback(txt){const area=document.createElement('textarea');area.value=txt;area.style.position='fixed';area.style.top='0';area.style.left='-9999px';document.body.appendChild(area);area.select();try{const ok=document.execCommand('copy');area.remove();return ok}catch(e){area.remove();return false}}
async function copy(txt){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);notify('복사했어요!');return}if(copyFallback(txt)){notify('복사했어요!');return}}catch(e){}notify('자동 복사가 제한돼 있어요. 내용을 선택해 복사해 주세요.')}
function header(count,helper){const top=el('div','topline');const left=el('div','heading');left.append(el('h1',null,'프롬프트 블록'),el('span','badge',count));top.append(left,el('span','helper',helper));return top}
function card(section,index,isRead=false){const item=el('section','block');item.dataset.sectionId=section.id;const head=el('div','blockhead');
if(!isRead){const h=iconButton('dots','길게 눌러 순서 이동','drag',index);h.classList.add('handle');head.append(h)}
head.append(el('span','index',String(index+1).padStart(2,'0')));
if(isRead){const t=el('span','titleInput',section.title||'제목 없음');t.style.cursor='default';t.style.border='none';head.append(t)}else{const title=el('input','titleInput');title.type='text';title.value=section.title;title.placeholder='제목 입력';title.dataset.action='title';title.dataset.index=index;title.maxLength=120;head.append(title);const buttons=el('div','headbuttons');const up=iconButton('up','위로 이동','up',index);up.disabled=index===0;const down=iconButton('down','아래로 이동','down',index);down.disabled=index===sections.length-1;buttons.append(up,down,iconButton('trash','삭제','delete',index,true));head.append(buttons)}
item.append(head);const body=el('div',isRead?'viewcontent':'blockbody');if(isRead){body.append(el('pre','readtext',section.content));}else{const ta=el('textarea','prompt');ta.value=section.content;ta.placeholder='이곳에 프롬프트를 입력하세요…';ta.spellcheck=false;ta.dataset.action='content';ta.dataset.index=index;body.append(ta)}
const foot=el('div','under');foot.append(el('span','note',isRead?'':'줄바꿈 · 가중치 그대로 유지'));const cb=el('button','copybtn');cb.type='button';cb.innerHTML=icons.copy+'<span>복사</span>';cb.dataset.action='copy';cb.dataset.index=index;foot.append(cb);body.append(foot);item.append(body);return item}
function renderEdit(){mode='edit';app.replaceChildren();app.append(header(sections.length,'⠿ 드래그하거나 화살표로 순서를 변경하세요'));const list=el('div','blocks');sections.forEach((s,i)=>list.append(card(s,i)));app.append(list);const add=el('button','addbtn','＋  프롬프트 추가');add.type='button';add.dataset.action='add';app.append(add);const share=el('button','sharebtn');share.type='button';share.innerHTML=icons.link+'공유하기';share.dataset.action='share';app.append(share);app.querySelectorAll('textarea').forEach(autoSize)}
function b64url(bytes){let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function from64(s){if(!/^[A-Za-z0-9_-]+$/.test(s))throw new Error('올바른 링크가 아니에요.');const bin=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
async function encodeData(data){const payload={v:1,n:makeId(),s:data.map(x=>[x.title,x.content])};const raw=new TextEncoder().encode(JSON.stringify(payload));let bytes=raw,type='u';if(typeof CompressionStream==='function'){try{const compressed=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());if(compressed.length<raw.length){bytes=compressed;type='g'}}catch(e){}}
return location.href.split('#')[0]+'#p='+type+'.'+b64url(bytes)}
async function decodeData(urlHash){if(urlHash.length>250000)throw new Error('링크가 너무 길어요.');const match=/^#p=([ug])\.([A-Za-z0-9_-]+)$/.exec(urlHash);if(!match)throw new Error('링크가 올바르지 않아요.');let bytes=from64(match[2]);if(match[1]==='g'){if(typeof DecompressionStream!=='function')throw new Error('이 브라우저는 압축 링크를 열 수 없어요. 최신 브라우저로 열어 주세요.');bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}
const payload=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes));if(payload.v!==1||!Array.isArray(payload.s)||payload.s.some(x=>!Array.isArray(x)||typeof x[0]!=='string'||typeof x[1]!=='string'))throw new Error('링크 데이터가 올바르지 않아요.');return payload.s.map(x=>({id:makeId(),title:x[0],content:x[1]}))}
function lengthNotice(link){const len=link.length;const msg=el('p','length-note');if(len>12000){msg.classList.add('warning');msg.textContent='⚠ 주소가 '+len.toLocaleString()+'자로 매우 길어요. X나 다른 앱에서 링크가 잘릴 수 있어요. 실제 게시 후 열리는지 확인해 주세요.'}else if(len>4000){msg.classList.add('caution');msg.textContent='주소 길이 '+len.toLocaleString()+'자 · X나 메신저에서 길이 제한이 있을 수 있으니 게시 후 확인해 주세요.'}else msg.textContent='주소 길이 '+len.toLocaleString()+'자 · 프롬프트 내용은 링크 안에 포함돼요.';return msg}
function renderSuccess(){mode='success';app.replaceChildren();const pan=el('div','panel center');pan.append(el('div','successicon','✓'),el('h1',null,'공유 링크가 만들어졌어요!'),el('p',null,'프롬프트 내용이 링크 주소 자체에 들어 있어요.'));const row=el('div','linkbox');const address=el('input');address.type='text';address.readOnly=true;address.value=latestLink;address.addEventListener('focus',()=>address.select());address.setAttribute('aria-label','생성된 공유 링크');row.append(address);const cb=el('button','copybtn');cb.dataset.action='copyLink';cb.innerHTML=icons.copy+'복사';row.append(cb);pan.append(row);const buttons=el('div','actions');[['링크 복사','copyLink','main'],['공유 페이지 열기','open',''],['새 프롬프트 만들기','new',''],['작성 화면으로','back','']].forEach(([txt,act,cl])=>{const b=el('button',cl,txt);b.dataset.action=act;buttons.append(b)});if(navigator.share){const b=el('button','share-menu','휴대폰으로 공유');b.dataset.action='nativeShare';buttons.append(b)}pan.append(buttons);pan.append(lengthNotice(latestLink));pan.append(el('p','smallnote','※ 데이터베이스·작성 기록 없이 작동해요. 링크를 잃으면 사이트에서 찾을 수 없어요. 이 파일을 웹에 배포해야 다른 사람도 접속할 수 있어요.'));app.append(pan)}
function allText(data){return data.map(s=>(s.title||'제목 없음')+'\n'+s.content).join('\n\n')}
function renderView(data){mode='view';currentView=data;app.replaceChildren();const top=el('div','previewbar');top.append(el('h1',null,'공유된 프롬프트'));const cp=el('button','copybtn');cp.innerHTML=icons.copy+'전체 복사';cp.dataset.action='copyAll';top.append(cp);app.append(top);app.append(el('p','viewhint','읽기 전용 · 각 프롬프트를 따로 복사할 수 있어요.'));const list=el('div','blocks');data.forEach((s,i)=>list.append(card(s,i,true)));app.append(list);const actions=el('div','viewactions');const clone=el('button','addbtn','＋  이 프롬프트를 복제해서 새로 작성');clone.dataset.action='clone';const share=el('button','sharebtn');share.innerHTML=icons.link+'링크 복사';share.dataset.action='copyCurrent';actions.append(clone,share);app.append(actions)}
function renderInvalid(msg){mode='invalid';app.replaceChildren();const p=el('div','panel center');p.append(el('h1',null,'링크를 열 수 없어요'),el('p',null,msg));const b=el('button','sharebtn','새 프롬프트 작성');b.dataset.action='new';p.append(b);app.append(p)}
function cleanUrl(){const dest=location.href.split('#')[0];try{history.replaceState(null,'',dest)}catch(e){location.hash=''}}
function newBlank(){sections=[{id:makeId(),title:'프롬프트 1',content:''}];latestLink='';currentView=null;cleanUrl();renderEdit();window.scrollTo({top:0,behavior:'smooth'})}
function swap(a,b){if(b<0||b>=sections.length||a===b)return;const x=sections.splice(a,1)[0];sections.splice(b,0,x);renderEdit()}
app.addEventListener('input',e=>{const field=e.target.dataset.action,index=Number(e.target.dataset.index);if(field==='content'){if(sections[index])sections[index].content=e.target.value;autoSize(e.target)}else if(field==='title'){if(sections[index])sections[index].title=e.target.value}});
app.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;const i=Number(b.dataset.index);
if(action==='add'){sections.push({id:makeId(),title:'프롬프트 '+(sections.length+1),content:''});renderEdit();const last=app.querySelector('.block:last-child');if(last){last.scrollIntoView({behavior:'smooth',block:'nearest'});last.querySelector('.titleInput').focus()}}
else if(action==='up')swap(i,i-1);else if(action==='down')swap(i,i+1);
else if(action==='delete'){if(sections.length<=1){sections=[{id:makeId(),title:'',content:''}]}else sections.splice(i,1);renderEdit()}
else if(action==='copy'){const data=mode==='view'?currentView:sections;if(data&&data[i])copy(data[i].content)}
else if(action==='share'){b.disabled=true;b.textContent='링크 만드는 중…';try{latestData=sections.map(s=>({id:makeId(),title:s.title,content:s.content}));latestLink=await encodeData(latestData);renderSuccess();window.scrollTo(0,0)}catch(err){notify('링크 생성에 실패했어요. 다시 시도해 주세요.');b.disabled=false;b.innerHTML=icons.link+'공유하기'}}
else if(action==='copyLink')copy(latestLink);
else if(action==='open'){location.hash=latestLink.slice(latestLink.indexOf('#')+1);renderView(latestData);window.scrollTo(0,0)}
else if(action==='nativeShare'){try{await navigator.share({title:'프롬프트 공유',url:latestLink})}catch(err){if(err.name!=='AbortError')notify('공유 메뉴를 사용할 수 없어요. 링크 복사를 이용해 주세요.')}}
else if(action==='new')newBlank();else if(action==='back'){renderEdit();window.scrollTo(0,0)}
else if(action==='copyAll'){if(currentView)copy(allText(currentView))}
else if(action==='copyCurrent')copy(location.href);
else if(action==='clone'){if(currentView){sections=currentView.map(s=>({...s,id:makeId()}));cleanUrl();renderEdit();window.scrollTo(0,0);notify('복제했어요! 수정하고 새 링크를 만들 수 있어요.')}}
});
let moving=null,hovered=null;
app.addEventListener('pointerdown',e=>{const h=e.target.closest('.handle');if(!h||mode!=='edit'||e.button!==0)return;const item=h.closest('.block');const idx=sections.findIndex(s=>s.id===item.dataset.sectionId);if(idx<0)return;moving={pointer:e.pointerId,from:idx,handle:h,card:item};h.setPointerCapture(e.pointerId);item.classList.add('dragging');e.preventDefault()});
app.addEventListener('pointermove',e=>{if(!moving||e.pointerId!==moving.pointer)return;const target=document.elementFromPoint(e.clientX,e.clientY);const item=target&&target.closest('.block');if(hovered&&hovered!==item)hovered.classList.remove('drop-target');hovered=item&&app.contains(item)?item:null;if(hovered&&hovered!==moving.card)hovered.classList.add('drop-target');e.preventDefault()});
function stopMove(e){if(!moving||e.pointerId!==moving.pointer)return;const from=moving.from;const target=hovered?sections.findIndex(s=>s.id===hovered.dataset.sectionId):-1;moving.card.classList.remove('dragging');if(hovered)hovered.classList.remove('drop-target');moving=null;hovered=null;if(e.type==='pointerup'&&target>=0&&target!==from)swap(from,target)}
app.addEventListener('pointerup',stopMove);app.addEventListener('pointercancel',stopMove);
async function onUrlChange(){if(location.hash.startsWith('#p=')){try{const data=await decodeData(location.hash);renderView(data)}catch(e){renderInvalid(e.message||'주소가 올바르지 않아요.')}}else if(mode==='view'||mode==='invalid'){renderEdit()}}
window.addEventListener('hashchange',onUrlChange);
if(location.hash.startsWith('#p='))onUrlChange();else renderEdit();
})();
</script>
